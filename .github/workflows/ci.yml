name: Platform checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: python -m pip install -c backend/requirements.lock -e 'backend[dev,runner]'
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Backend tests
        working-directory: backend
        env:
          PLAYWRIGHT_TESTS: '1'
        run: python -m pytest -q
      - name: Lint backend
        working-directory: backend
        run: python -m ruff check app tests
      - name: Validate migrations and model drift
        working-directory: backend
        run: |
          python -m app.cli migrate
          python -m alembic check
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Browser acceptance
        run: python scripts/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: docs/verification/*.png
